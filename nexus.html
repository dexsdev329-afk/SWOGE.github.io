<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>
/* ================== CORRECTIFS COMMUNS ==================
 * Bloc identique sur les autres pages du site. Voir connect4.html pour le
 * detail : pas de double-tap-zoom sur les boutons, noir releve en `screen`,
 * cibles tactiles a 44px minimum, canvas qui ne laisse rien defiler. */
html{ -webkit-text-size-adjust:100%; }
html::after{ content:""; position:fixed; inset:0; pointer-events:none;
  z-index:2147483000; background:#12121a; mix-blend-mode:screen; }
button, a, input, select, textarea, label, summary,
[role="button"], [onclick],
.card, .chipbtn, .btn, .tile, .sbet, .qclaim, .abtn, .pct, .chip, .sday{
  touch-action:manipulation;
}
canvas{ touch-action:none; }
.menubtn{ min-width:44px; min-height:44px; }
</style>

<title>SWOGE Nexus — the hub between your vault and the shop</title>
<meta name="description" content="Walk your equipped character through the SWOGE Nexus — a calm hub with a fountain, a market stall and a vault door leading straight into your profile.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<script src="stakebubble.js?v=20260819b"></script>

<style>
html,body{ height:100%; margin:0; background:#0A1128; overscroll-behavior:none; }
body{ font-family:'Archivo',system-ui,sans-serif; }

#nxWrap{ position:fixed; inset:0; overflow:hidden; }
#nxCanvas{ position:absolute; inset:0; width:100%; height:100%; display:block;
  background:#0A1128; }

/* ---- le solde, en haut a gauche ----
 * Le Nexus n'a pas de <nav> — c'est voulu, voir plus bas — et le badge de
 * solde du reste du site (`poseSolde`) s'accroche justement a un <nav> :
 * il ne se serait jamais pose ici. On en refait un petit, dans le meme
 * langage visuel dore que celui-la, plutot que de forcer un <nav> vide rien
 * que pour l'attirer et perdre au passage le repli « Go to » du tiroir. */
#nxSolde{ position:absolute; left:max(14px, env(safe-area-inset-left));
  top:max(14px, env(safe-area-inset-top)); z-index:20; pointer-events:none;
  display:inline-flex; align-items:center; gap:7px;
  padding:7px 13px; border-radius:999px; color:#FFD97A;
  font:800 13px/1.3 'Archivo',system-ui,sans-serif; white-space:nowrap;
  background:linear-gradient(180deg,rgba(46,26,10,.92),rgba(20,10,4,.96));
  border:1px solid rgba(230,165,55,.45); opacity:0; transition:opacity .25s ease; }
#nxSolde.on{ opacity:1; }
#nxSolde em{ font-style:normal; font-size:10px; color:#C9A24A; letter-spacing:.8px; }
@media (max-width:520px){ #nxSolde{ font-size:11px; padding:5px 10px; } }
@media (max-width:640px){ #nxSolde em{ display:none; } }

/* ---- l'indice du lieu, en haut ----
 * Le nom du point d'interet le plus proche, pas un bouton : on entre en
 * marchant dessus, l'indice dit juste ce qui va se passer avant que ca
 * n'arrive, pour que ca ne surprenne jamais. */
#nxIndice{ position:absolute; left:calc(50% - var(--nxp) / 2); top:max(14px, env(safe-area-inset-top));
  transform:translateX(-50%); z-index:20; pointer-events:none;
  padding:8px 16px; border-radius:999px; background:rgba(10,17,40,.78);
  border:1px solid rgba(255,255,255,.16); color:#eaf0ff;
  font:700 13px/1.3 'Archivo',system-ui,sans-serif; letter-spacing:.2px;
  opacity:0; transition:opacity .25s ease; text-align:center; max-width:80vw; }
#nxIndice.on{ opacity:1; }
#nxIndice b{ color:#ffd54a; }

/* ================== LE PANNEAU DU PERSONNAGE ==================
 *
 * La colonne de droite, dans l'ordre exact d'une fiche RotMG : la carte du
 * lieu, le nom, les trois barres (niveau, vie, mana), les six attributs sur
 * deux colonnes, les quatre cases d'equipement, le sac, et tout en bas les
 * joueurs a portee.
 *
 * ---- pourquoi cet ordre-la et pas un autre ----
 *
 * Il va du PLUS regarde au moins regarde. Pendant qu'on marche, on jette un
 * oeil a la carte et aux barres ; l'equipement, on le consulte quand on
 * s'arrete. Mettre les stats en haut ferait descendre les yeux a chaque pas.
 *
 * Ce panneau remplace la pastille « X players nearby » : elle disait le
 * NOMBRE, la liste dit QUI — et au meme endroit que le reste de ce qu'on
 * consulte, au lieu d'un troisieme coin de l'ecran.
 */
/* La largeur du panneau suit celle de l'ecran : une bande de 236px sur un
   moniteur large se lit comme un ruban ecrase au bord, alors que c'est la
   fiche du personnage — ce qu'on consulte le plus apres la carte. */
:root{ --nxp:236px; }
@media (min-width:1500px){ :root{ --nxp:320px; } }
@media (min-width:2200px){ :root{ --nxp:400px; } }

/* ---- LA TYPOGRAPHIE SUIT LA LARGEUR ----
 * Elargir le panneau sans grossir son texte donne une colonne large remplie
 * de caracteres minuscules — pire que la bande etroite d'avant. Les deux
 * vont ensemble, aux memes paliers. */
@media (min-width:1500px){
  .nxp-nom b{ font-size:20px; }
  .nxp-nom img{ width:28px; height:28px; }
  .nxp-b{ height:24px; }
  .nxp-b span{ font-size:13.5px; line-height:24px; }
  .nxp-b em{ font-size:12px; line-height:24px; }
  .nxp-st{ font-size:13px; }
  .nxp-c b{ font-size:11px; }
  .nxp-c u{ font-size:19px; }
  .nxp-g span{ font-size:13px; }
  .nxp-g img{ width:21px; height:21px; }
  .nxp-vide{ font-size:13px; }
  #nxReglages{ width:32px; height:32px; font-size:16px; }
}
@media (min-width:2200px){
  .nxp-nom b{ font-size:24px; }
  .nxp-nom img{ width:34px; height:34px; }
  .nxp-b{ height:29px; }
  .nxp-b span{ font-size:16px; line-height:29px; }
  .nxp-b em{ font-size:14px; line-height:29px; }
  .nxp-st{ font-size:15.5px; }
  .nxp-c b{ font-size:13px; }
  .nxp-c u{ font-size:23px; }
  .nxp-g span{ font-size:15px; }
  .nxp-g img{ width:25px; height:25px; }
  .nxp-vide{ font-size:15px; }
  #nxReglages{ width:38px; height:38px; font-size:19px; }
}
@media (max-width:820px){ :root{ --nxp:170px; } }
@media (max-width:420px){ :root{ --nxp:148px; } }

#nxPanneau{ position:absolute; top:0; right:0; bottom:0; width:var(--nxp);
  z-index:22; display:flex; flex-direction:column; gap:6px;
  padding:8px 8px calc(8px + env(safe-area-inset-bottom));
  padding-top:calc(8px + env(safe-area-inset-top));
  background:#3f3f3f; border-left:1px solid #222; overflow-y:auto;
  font-family:'Archivo',system-ui,sans-serif; color:#dcdcdc;
  scrollbar-width:none; }
#nxPanneau::-webkit-scrollbar{ display:none; }

/* la carte du lieu : un carre noir, comme dans le jeu d'origine */
#nxMini{ width:100%; aspect-ratio:1; display:block; background:#000;
  border:1px solid #222; image-rendering:pixelated; flex:0 0 auto; }

/* le nom, precede de la vignette du personnage porte */
.nxp-nom{ display:flex; align-items:center; gap:7px; margin-top:2px; }
.nxp-nom img{ width:22px; height:22px; object-fit:contain; flex:0 0 auto; }
.nxp-nom b{ font-size:16px; font-weight:700; color:#f2f2f2; letter-spacing:.3px;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

/* les trois barres. Le libelle est DANS la barre, a gauche, comme l'original */
.nxp-b{ position:relative; height:19px; border:1px solid #1c1c1c; background:#2a2a2a;
  overflow:hidden; flex:0 0 auto; }
.nxp-b i{ position:absolute; inset:0 auto 0 0; display:block; }
.nxp-b span{ position:relative; z-index:1; display:block; padding:0 5px;
  font:700 11px/19px 'Archivo',system-ui,sans-serif; color:#fff;
  text-shadow:0 1px 2px rgba(0,0,0,.85); }
.nxp-b em{ position:absolute; right:5px; top:0; z-index:1; font-style:normal;
  font:600 10px/19px 'Archivo',system-ui,sans-serif; color:rgba(255,255,255,.85);
  text-shadow:0 1px 2px rgba(0,0,0,.85); }
.nxp-lvl i{ background:#6d9b26; } .nxp-hp i{ background:#b52d2d; } .nxp-mp i{ background:#2f4fbf; }

/* les six attributs, deux colonnes — la valeur passe au vert des qu'un
   objet l'augmente, et le bonus est dit a cote : c'est la seule facon de
   voir ce qu'un equipement apporte vraiment */
.nxp-stats{ display:grid; grid-template-columns:1fr 1fr; gap:1px 8px;
  padding:3px 2px; flex:0 0 auto; }
.nxp-st{ font-size:10.5px; color:#9a9a9a; white-space:nowrap; }
.nxp-st b{ font-weight:700; color:#e8e8e8; }
.nxp-st.up b{ color:#63d13f; }
.nxp-st u{ text-decoration:none; color:#63d13f; font-weight:700; }

/* les cases : quatre d'equipement en haut, huit de sac en dessous */
.nxp-cases{ display:grid; grid-template-columns:repeat(4,1fr); gap:4px; flex:0 0 auto; }
.nxp-c{ position:relative; aspect-ratio:1; background:#2b3340; border:1px solid #171b22;
  display:flex; align-items:center; justify-content:center; }
.nxp-c img{ width:78%; height:78%; object-fit:contain; }
.nxp-c.vide{ background:#333; }
.nxp-c u{ text-decoration:none; font:700 15px/1 'Archivo',system-ui,sans-serif; color:#4d4d4d; }
.nxp-c b{ position:absolute; right:1px; bottom:0; font:700 9px/1 'Archivo',system-ui,sans-serif;
  color:#63d13f; text-shadow:0 1px 2px #000; }

/* les joueurs a portee, deux colonnes, avec leur vignette */
.nxp-gens{ display:grid; grid-template-columns:1fr 1fr; gap:3px 6px;
  border-top:1px solid #2b2b2b; padding-top:6px; margin-top:2px; }
.nxp-g{ display:flex; align-items:center; gap:5px; min-width:0; }
.nxp-g img{ width:17px; height:17px; object-fit:contain; flex:0 0 auto; }
.nxp-g span{ font-size:11px; color:#dcdcdc; overflow:hidden;
  text-overflow:ellipsis; white-space:nowrap; }
.nxp-seul{ grid-column:1/-1; font-size:10.5px; color:#7d7d7d; }

/* ---- le bouton de reglages, au bout de la ligne du nom ----
 * `margin-left:auto` le pousse a droite sans le sortir du flux : il reste
 * sur la meme ligne que le nom, quelle que soit la longueur de celui-ci. */
#nxReglages{ margin-left:auto; flex:0 0 auto; width:26px; height:26px;
  border-radius:7px; display:flex; align-items:center; justify-content:center;
  font-size:13px; background:#2b3340; border:1px solid #171b22;
  color:#dcdcdc; cursor:pointer; }
#nxReglages:hover{ background:#39424f; }

/* ---- pourquoi le panneau est vide ---- */
.nxp-vide{ font-style:normal; font-size:11px; line-height:1.45; color:#9a9a9a;
  display:none; }
.nxp-vide a{ color:#FFD97A; }

/* ---- replier le panneau ----
 * Sur telephone il mange plus du tiers de l'ecran. Le bouton reste COLLE a
 * son bord : il suit le panneau quand il se retire, donc on le retrouve au
 * meme endroit du regard, et il ne peut jamais se retrouver dessous. */
#nxPanneau{ transition:transform .22s ease; }
#nxWrap.replie #nxPanneau{ transform:translateX(100%); }
/* Il vit SUR LA CARTE, pas sur le panneau : colle au bord, il mordait sur la
   premiere lettre de chaque stat (« TT - 28 » au lieu de « ATT - 28 »). Un
   ecart de 10px l'en decolle franchement, et il descend au tiers bas pour ne
   croiser ni les barres ni la grille de stats. */
#nxBascule{ position:absolute; right:calc(var(--nxp) + 10px); top:68%; z-index:23;
  /* `right` est REPOSITIONNE en JS d'apres la largeur reellement rendue du
     panneau : `--nxp` ne la donne pas exactement (une barre de defilement
     s'intercale), et le bouton mordait de quelques pixels sur la premiere
     lettre de chaque stat. La valeur ci-dessus n'est qu'un point de depart
     avant la premiere mesure. */
  transform:translateY(-50%); transition:right .22s ease;
  width:26px; height:52px; border-radius:9px;
  display:flex; align-items:center; justify-content:center; font-size:11px;
  background:rgba(10,17,40,.82); border:1px solid rgba(255,255,255,.18);
  color:#dcdcdc; cursor:pointer; padding:0; }
/* Replie : le bouton revient au bord, et le chevron se retourne — il montre
   toujours le sens dans lequel le panneau va partir. */
#nxWrap.replie #nxBascule{ right:10px; transform:translateY(-50%) scaleX(-1); }
/* L'indice se recentre sur toute la largeur des que le panneau s'efface. */
#nxWrap.replie #nxIndice{ left:50%; }

/* ---- la feuille des reglages ---- */
#nxReglagesVoile{ position:fixed; inset:0; z-index:90; background:rgba(4,7,13,.66);
  display:flex; align-items:center; justify-content:center; padding:16px;
  opacity:0; pointer-events:none; transition:opacity .18s ease; }
#nxReglagesVoile.on{ opacity:1; pointer-events:auto; }
.nxrp-carte{ width:100%; max-width:360px; max-height:86vh; overflow-y:auto;
  background:#131B2A; border:1px solid rgba(255,255,255,.12); border-radius:18px;
  padding:22px 20px; position:relative; transform:scale(.94); opacity:0;
  transition:transform .2s,opacity .2s; }
#nxReglagesVoile.on .nxrp-carte{ transform:none; opacity:1; }
.nxrp-x{ position:absolute; top:12px; right:12px; width:30px; height:30px;
  border-radius:9px; border:1px solid rgba(255,255,255,.14);
  background:rgba(255,255,255,.05); color:#c9d3f2; font-size:16px; cursor:pointer; }
.nxrp-titre{ display:block; font-size:17px; font-weight:800; color:#F2F6FF;
  margin-bottom:14px; }
.nxrp-ligne{ display:flex; align-items:center; justify-content:space-between;
  gap:12px; padding:9px 0; border-bottom:1px solid rgba(255,255,255,.08); }
.nxrp-ligne:last-of-type{ border-bottom:none; }
.nxrp-nom{ font-size:13.5px; color:#c9d3f2; }
.nxrp-touche{ min-width:74px; padding:8px 12px; border-radius:10px;
  border:1px solid rgba(255,255,255,.18); background:rgba(255,255,255,.06);
  color:#eaf0ff; font:700 12.5px/1.2 'Space Mono',monospace; cursor:pointer;
  text-align:center; }
.nxrp-touche:hover{ background:rgba(255,255,255,.12); }
.nxrp-touche.attend{ border-color:rgba(255,197,61,.6); color:#FFD97A;
  background:rgba(255,197,61,.1); }
.nxrp-nom .nxrp-sous{ display:block; font-style:normal; font-size:10.5px;
  color:#5C6B85; margin-top:2px; }
.nxrp-bascule{ flex:0 0 auto; min-width:56px; padding:8px 12px; border-radius:10px;
  border:1px solid rgba(255,255,255,.18); background:rgba(255,255,255,.06);
  color:#8DA0C4; font:800 12px 'Space Mono',monospace; cursor:pointer; }
.nxrp-bascule.on{ border-color:rgba(124,255,155,.55); background:rgba(124,255,155,.12);
  color:#7CFF9B; }
.nxrp-note{ margin-top:12px; font-size:11.5px; line-height:1.5; color:#5C6B85; }

/* Le temoin AUTO sur la scene : quand le tir part tout seul, il faut le voir
   sans ouvrir les reglages — sinon on croit a un bug. */
#nxAuto{ position:absolute; left:max(14px, env(safe-area-inset-left));
  top:calc(max(14px, env(safe-area-inset-top)) + 44px); z-index:21;
  padding:5px 11px; border-radius:999px; display:none;
  background:rgba(12,40,20,.85); border:1px solid rgba(124,255,155,.5);
  color:#7CFF9B; font:800 11px/1.3 'Space Mono',monospace; letter-spacing:.5px; }
#nxAuto.on{ display:block; }
.nxrp-reset{ margin-top:14px; width:100%; padding:11px; border-radius:12px;
  border:1px solid rgba(255,255,255,.14); background:rgba(255,255,255,.04);
  color:#c9d3f2; font:700 13px 'Archivo',system-ui,sans-serif; cursor:pointer; }
.nxrp-reset:hover{ background:rgba(255,255,255,.09); color:#fff; }

/* ---- le pave tactile, en bas a gauche ----
 * Le clavier marche deja sur ordinateur (WASD / fleches). Sur telephone il
 * n'y a rien d'autre : quatre boutons en croix, tenus au doigt. */
#nxPad{ position:absolute; left:max(16px, env(safe-area-inset-left));
  bottom:max(16px, env(safe-area-inset-bottom)); z-index:20;
  width:150px; height:150px; display:grid;
  grid-template-columns:1fr 1fr 1fr; grid-template-rows:1fr 1fr 1fr;
  gap:4px; touch-action:none; user-select:none; -webkit-user-select:none; }
#nxPad button{ grid-column:2; background:rgba(20,26,50,.62);
  border:1px solid rgba(255,255,255,.22); border-radius:12px; color:#eaf0ff;
  font-size:18px; display:flex; align-items:center; justify-content:center;
  touch-action:none; }
#nxPad button:active, #nxPad button.on{ background:rgba(90,120,220,.55);
  border-color:rgba(255,255,255,.5); }
#nxPad .u{ grid-row:1; } #nxPad .l{ grid-row:2; grid-column:1; }
#nxPad .r{ grid-row:2; grid-column:3; } #nxPad .d{ grid-row:3; }

@media (min-width:900px) and (pointer:fine){
  #nxPad{ display:none; }     /* clavier disponible : la croix n'ajoute rien */
  #nxHint{ display:block; }
}
#nxHint{ display:none; position:absolute; left:max(16px, env(safe-area-inset-left));
  bottom:max(16px, env(safe-area-inset-bottom)); z-index:20; pointer-events:none;
  padding:7px 12px; border-radius:10px; background:rgba(10,17,40,.6);
  color:#c9d3f2; font:600 12px/1.3 'Space Mono',monospace; }

body{ background:url('img/a77f9f5ed053.jpg') center center/cover no-repeat fixed; background-color:#0A1128; }
@media (orientation:landscape){ body{ background-image:url('img/8080b12ee3d6.jpg'); } }
</style>
</head>
<body>
<div id="preloader"><style>
#preloader{position:fixed;inset:0;z-index:100000;background:#0c0518 url('img/a77f9f5ed053.jpg') center/cover no-repeat;display:flex;align-items:flex-end;justify-content:center;padding-bottom:20vh;transition:opacity .6s ease;font-family:'Orbitron',system-ui,sans-serif}
@media (orientation:landscape){#preloader{background-image:url('img/8080b12ee3d6.jpg');align-items:center;padding-bottom:0}}
#preloader.done{opacity:0;pointer-events:none}
#preloader .pl-box{text-align:center}
#preloader .pl-title{width:min(76vw,370px);aspect-ratio:1.5;background:center/contain no-repeat;margin:0 auto 14px;filter:drop-shadow(0 3px 8px rgba(0,0,0,.6))}
#preloader .pl-bar{position:relative;width:min(82vw,360px);aspect-ratio:1.533;background:url('img/bbf304b6e22c.png') center/100% 100% no-repeat;margin:0 auto}
#preloader .pl-bar .fill{position:absolute;top:40%;left:14.5%;width:62.3%;height:19%;border-radius:999px;overflow:hidden}
#preloader .pl-bar .fill i{display:block;height:100%;width:26%;border-radius:999px;background:linear-gradient(90deg,#f2a900,#ffe680);box-shadow:0 0 12px #ffd54a;animation:plload 1.1s ease-in-out infinite}
@keyframes plload{0%{margin-left:-26%}100%{margin-left:100%}}
#preloader .pl-txt{width:min(46vw,180px);aspect-ratio:1.732;background:url('img/dbeab9e4c466.png') center/contain no-repeat;margin:6px auto 0}
</style><div class="pl-box"><div class="pl-title" style="background-image:url('img/card_nx.webp')"></div><div class="pl-bar"><span class="fill"><i></i></span></div><div class="pl-txt"></div></div></div>

<div id="nxWrap">
  <canvas id="nxCanvas"></canvas>
  <div id="nxSolde"></div>
  <div id="nxAuto">⌖ AUTO-FIRE</div>
  <div id="nxIndice"></div>
  <button id="nxBascule" type="button" aria-label="Hide panel">&#9654;</button>
  <div id="nxHint">WASD / arrows to move &middot; walk in to enter</div>

  <aside id="nxPanneau">
    <canvas id="nxMini" width="120" height="120"></canvas>
    <div class="nxp-nom">
      <img alt="" id="nxVignette"><b id="nxNom">—</b>
      <button id="nxReglages" type="button" aria-label="Controls">&#9881;&#65039;</button>
    </div>
    <i id="nxVide" class="nxp-vide"></i>
    <div class="nxp-b nxp-lvl"><i id="nxLvlJauge"></i><span id="nxLvl">Lvl 1</span><em id="nxXp"></em></div>
    <div class="nxp-b nxp-hp"><i style="width:100%"></i><span>HP</span><em id="nxHp"></em></div>
    <div class="nxp-b nxp-mp"><i style="width:100%"></i><span>MP</span><em id="nxMp"></em></div>
    <div class="nxp-stats" id="nxStats"></div>
    <div class="nxp-cases" id="nxEquip"></div>
    <div class="nxp-cases" id="nxSac"></div>
    <div class="nxp-gens" id="nxGens"></div>
  </aside>
  <div id="nxPad" aria-hidden="true">
    <button class="u" type="button" data-dir="up" aria-label="Move up">&#9650;</button>
    <button class="l" type="button" data-dir="left" aria-label="Move left">&#9664;</button>
    <button class="r" type="button" data-dir="right" aria-label="Move right">&#9654;</button>
    <button class="d" type="button" data-dir="down" aria-label="Move down">&#9660;</button>
  </div>
</div>

<div id="nxReglagesVoile">
  <div class="nxrp-carte">
    <button class="nxrp-x" type="button" aria-label="Close">&times;</button>
    <b class="nxrp-titre">Controls</b>
    <div class="nxrp-ligne">
      <span class="nxrp-nom">Auto-fire<i class="nxrp-sous">keeps shooting, aims at the nearest enemy</i></span>
      <button class="nxrp-bascule" id="nxAutoBtn" type="button" aria-pressed="false">OFF</button>
