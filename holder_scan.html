<!-- ==================== L'ANCIENNE ADRESSE ====================
     La page s'appelait « Holder Scan » et ne parlait que des detenteurs.
     Elle repond maintenant a la question que les gens tapent vraiment —
     « is this token a scam » — et vit a `swoge_scan.html`.

     Ce fichier reste parce qu'un lien partage il y a un mois doit continuer
     de marcher : une adresse qu'on a donnee a quelqu'un ne s'efface pas.
     `canonical` dit aux moteurs laquelle des deux compte, sinon les deux se
     font concurrence et aucune ne gagne. -->
<title>SWOGE Scan</title>
<link rel="canonical" href="https://swoleeswoge.dog/swoge_scan.html">
<meta name="robots" content="noindex,follow">
<meta http-equiv="refresh" content="0; url=swoge_scan.html">

<!-- L icône, le temps de la redirection. Pas de balise de partage : la page
     est en `noindex`, et c est `swoge_scan.html` qui porte l aperçu. -->
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/img/site/icone-32.png">
<link rel="apple-touch-icon" href="/img/site/icone-180.png">
<link rel="manifest" href="/site.webmanifest">
<meta name="theme-color" content="#1B5FE0">
<script>
  /* L'adresse demandee suit : quelqu'un qui a partage un lien vers un jeton
     precis doit retrouver CE jeton, pas la page vide. */
  try { location.replace('swoge_scan.html' + (location.search || '') + (location.hash || '')); }
  catch (e) { location.href = 'swoge_scan.html'; }
</script>
<p style="font:16px/1.6 system-ui,sans-serif;padding:24px">
