<!doctype html><html><head><meta charset="utf-8"><title>{{nom}}</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap">
<style>
  :root { --ink:#0A1F44; --dim:#6B7C99; --line:#E1E9F6; --bleu:#1B5FE0; --gain:#12A150; --gold:#B07908; --loss:#E5484D; --fond:#F6F8FC; }
  html,body{margin:0;width:{{largeur}}px;height:{{hauteur}}px;overflow:hidden}
  body{font-family:"Outfit","Segoe UI",Arial,sans-serif;color:var(--ink);background:
    radial-gradient(1200px 700px at 85% 10%, #E7EEFF 0%, transparent 60%),
    radial-gradient(900px 600px at 10% 100%, #E3F6EA 0%, transparent 55%), var(--fond)}
  .cadre{position:absolute;inset:0;padding:6% 7%;display:flex;flex-direction:column;justify-content:space-between;box-sizing:border-box}
  .sur{font-family:"JetBrains Mono",monospace;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--bleu);font-size:{{hauteur}}px;font-size:calc({{hauteur}}px * .03)}
  .titre{font-weight:700;line-height:1.02;letter-spacing:-.02em;font-size:calc({{hauteur}}px * .105);margin:.25em 0 .35em;max-width:88%}
  .titre b{color:var(--gain)}
  ul{list-style:none;margin:0;padding:0;display:grid;gap:.35em;font-family:"JetBrains Mono",monospace;font-size:calc({{hauteur}}px * .036);color:var(--dim)}
  ul li::before{content:"▸ ";color:var(--gold)}
  .pied{display:flex;justify-content:space-between;align-items:flex-end;font-family:"JetBrains Mono",monospace;font-size:calc({{hauteur}}px * .03);color:var(--dim);border-top:2px solid var(--line);padding-top:1.2em}
  .pied b{color:var(--ink);font-weight:700}
  .hex{position:absolute;right:7%;top:8%;width:calc({{hauteur}}px * .34);height:calc({{hauteur}}px * .34);opacity:.9}
</style></head><body>
<svg class="hex" viewBox="0 0 100 100" aria-hidden="true">
  <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1B5FE0"/><stop offset="1" stop-color="#12A150"/></linearGradient></defs>
  <polygon points="50,4 90,27 90,73 50,96 10,73 10,27" fill="none" stroke="url(#g)" stroke-width="3"/>
  <polygon points="50,22 74,36 74,64 50,78 26,64 26,36" fill="url(#g)" opacity=".15"/>
  <g fill="#0A1F44"><circle cx="50" cy="50" r="4"/><circle cx="50" cy="14" r="3"/><circle cx="82" cy="32" r="3"/><circle cx="82" cy="68" r="3"/><circle cx="50" cy="86" r="3"/><circle cx="18" cy="68" r="3"/><circle cx="18" cy="32" r="3"/></g>
  <g stroke="#0A1F44" stroke-width="1.2" opacity=".5"><line x1="50" y1="50" x2="50" y2="14"/><line x1="50" y1="50" x2="82" y2="32"/><line x1="50" y1="50" x2="82" y2="68"/><line x1="50" y1="50" x2="50" y2="86"/><line x1="50" y1="50" x2="18" y2="68"/><line x1="50" y1="50" x2="18" y2="32"/></g>
</svg>
<div class="cadre">
  <div>
    <div class="sur">{{sur}}</div>
    <div class="titre">{{titre}}</div>
    <ul>{{#lignes}}<li>{{.}}</li>{{/lignes}}</ul>
  </div>
  <div class="pied"><span><b>{{pied}}</b></span><span>{{note}}</span></div>
</div>
</body></html>
