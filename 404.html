:root{ --bleu:#1B5FE0; --encre:#0B1B36; --doux:#6B7C99; --trait:#E1E9F6; --pale:#EEF3FB; --fond:#F6F9FE; }
*{ box-sizing:border-box; }
html{ -webkit-text-size-adjust:100%; }
body{ margin:0; background:var(--fond); color:var(--encre); font:500 15px/1.5 'Inter',system-ui,sans-serif; }
a{ color:inherit; text-decoration:none; }
.haut{ display:flex; align-items:center; gap:14px; padding:10px 16px; background:#FFFFFF;
  border-bottom:1px solid var(--trait); position:sticky; top:0; z-index:3; }
.marque{ display:flex; align-items:center; gap:9px; }
.patte{ width:34px; height:34px; border-radius:10px; background:#EAF1FF; display:grid; place-items:center; font-size:19px; }
.marque b{ display:block; font:800 17px/1 'Inter',system-ui,sans-serif; letter-spacing:.4px; color:var(--bleu); }
.marque i{ display:block; font:700 9.5px/1.4 'Inter',system-ui,sans-serif; font-style:normal; letter-spacing:2.6px; color:var(--doux); }
main{ max-width:640px; margin:0 auto; padding:48px 16px 64px; text-align:center; }
.code{ font:900 clamp(64px,18vw,112px)/1 'Inter',system-ui,sans-serif; letter-spacing:-3px;

h1{ font:800 clamp(22px,5vw,30px)/1.15 'Inter',system-ui,sans-serif; letter-spacing:-.5px; margin:10px 0 8px; }
.sous{ color:var(--doux); margin:0 auto 28px; max-width:44ch; }
.liens{ display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px; text-align:left;
  background:#FFFFFF; border:1px solid var(--trait); border-radius:14px; padding:8px;
  box-shadow:0 1px 2px rgba(11,27,54,.06), 0 8px 24px rgba(11,27,54,.05); }
.liens a{ display:flex; align-items:center; gap:11px; padding:12px; border-radius:10px; font:600 14px/1 'Inter',system-ui,sans-serif; min-height:44px; }
.liens a:hover, .liens a:focus-visible{ background:var(--pale); color:var(--bleu); outline:none; }
.liens .ic{ width:20px; text-align:center; font-size:16px; }
.liens a.premier{ background:#EAF1FF; color:var(--bleu); }
